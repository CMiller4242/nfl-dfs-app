name: Refresh DFS Data

on:
  schedule:
    # Every Tuesday at 11:00 UTC (~6-7am US Eastern), after Monday Night Football
    # stats have settled.
    - cron: "0 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

# Only one refresh runs at a time. If a scheduled and a manual run (or two
# manual runs) overlap, the second one queues behind the first instead of
# racing it - two concurrent `git push`es here could otherwise conflict or,
# worse, interleave a partial commit of the generated Parquet files.
# cancel-in-progress is deliberately false: a run already mid-commit should
# finish, not be killed partway through.
concurrency:
  group: refresh-dfs-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No error suppression anywhere in this workflow: a non-zero exit from
      # the pipeline (or from git below) fails this step and the whole run
      # shows red in the Actions tab - nothing here is allowed to fail silently.
      - name: Run data pipeline
        run: python dfs_data_pipeline.py

      - name: Commit and push refreshed data
        shell: bash -euo pipefail {0}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.parquet data/metadata.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated weekly data refresh"
            git push
          fi
