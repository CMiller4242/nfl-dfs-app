name: Refresh DFS Data

on:
  schedule:
    # Every Tuesday at 11:00 UTC (~6-7am US Eastern), after Monday Night Football
    # stats have settled.
    - cron: "0 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python dfs_data_pipeline.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.parquet data/metadata.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated weekly data refresh"
            git push
          fi
